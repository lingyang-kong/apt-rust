name: Publish APT archive

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: Build even when the published manifest is current
        required: false
        default: false
        type: boolean
      full_validation:
        description: Build and run upgrade, documentation, signature-rejection and removal checks
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: rust-pages
  cancel-in-progress: false

env:
  PUBLISHED_MANIFEST_URL: ${{ format('{0}/releases.json', vars.APT_BASE_URL || 'https://lingyang-kong.github.io/rust') }}

jobs:
  poll:
    if: vars.PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-slim
    outputs:
      changed: ${{ steps.poll.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Poll the published manifest
        id: poll
        env:
          FORCE_BUILD: ${{ inputs.force_build || inputs.full_validation || false }}
        run: |
          changed="$(scripts/poll-release.sh)"
          printf 'changed=%s\n' "$changed" >>"$GITHUB_OUTPUT"

  build:
    needs: poll
    if: needs.poll.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: read
    env:
      CACHE_DIR: /tmp/rust-apt-cache
      OUT_DIR: /tmp/rust-apt-dist
    steps:
      - name: Install shell and packaging dependencies
        id: install
        background: true
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            bash jq curl gnupg apt-utils dpkg-dev binutils patchelf xz-utils \
            coreutils findutils util-linux shellcheck

      - name: Restore build cache
        id: cache
        background: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CACHE_DIR }}
          key: rust-apt-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            rust-apt-cache-${{ runner.os }}-

      - uses: actions/configure-pages@v5
        background: true

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - wait: install

      - name: Run ShellCheck
        id: shellcheck
        background: true
        run: shellcheck scripts/*.sh scripts/lib/*.sh tests/*.sh

      - name: Run shell tests
        id: shell-tests
        background: true
        run: tests/test.sh

      - wait: cache

      - name: Build the archive
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: scripts/sync-apt-repo.sh

      - name: Save build cache
        id: save-cache
        background: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CACHE_DIR }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - wait: [shellcheck, shell-tests]

      - name: Test the generated archive on the Jammy runner
        env:
          FULL_VALIDATION: ${{ inputs.full_validation || false }}
        run: |
          args=()
          if [[ $FULL_VALIDATION == true ]]; then
            args+=(--full)
          fi
          tests/test-jammy.sh "${args[@]}" "$OUT_DIR"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
